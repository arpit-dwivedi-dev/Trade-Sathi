<div class="symbol-search-row">
  <p-select
    class="symbol-search-market"
    [options]="marketOptions"
    optionLabel="label"
    optionValue="code"
    [ngModel]="market()"
    (onChange)="onMarketChange($event.value)"
    ariaLabel="Stock market"
  />

  <div class="symbol-search">
    <span class="symbol-search-icon" aria-hidden="true">
      <app-icon name="image_search" />
    </span>
    <p-autoComplete
      class="symbol-search-autocomplete"
      styleClass="symbol-search-autocomplete-field"
      panelStyleClass="symbol-search-panel"
      [placeholder]="placeholder()"
      [ngModel]="queryInput()"
      (ngModelChange)="onQueryChange($event)"
      (keydown.escape)="dismissResults()"
      (onSelect)="onOptionSelected($event.value)"
      [suggestions]="results()"
      [minLength]="2"
      [delay]="0"
      [dropdown]="false"
      [showClear]="false"
      [showEmptyMessage]="true"
      emptyMessage="No instruments found."
      name="query"
      autocomplete="off"
      ariaLabel="Search instruments"
    >
      <ng-template #item let-result>
        <span class="symbol-search-row-content">
          @if (result.logoUrl) {
            <img
              class="symbol-search-logo symbol-search-logo-img"
              [src]="result.logoUrl"
              (error)="onLogoError($event)"
              alt=""
              aria-hidden="true"
              loading="lazy"
            />
          } @else {
            <span
              class="symbol-search-logo"
              [style.background]="avatarColor(result)"
              aria-hidden="true"
            >{{ initials(result) }}</span>
          }
          <span class="tnum symbol-search-sym">{{ result.symbol }}</span>
          <span class="symbol-search-name trunc">{{ result.name }}</span>
          <span class="symbol-search-exchange">{{ result.exchange }}</span>
        </span>
      </ng-template>
    </p-autoComplete>
    @if (searching()) {
      <p-progress-spinner
        class="symbol-search-spin"
        [style]="{ width: '16px', height: '16px' }"
        strokeWidth="6"
        aria-hidden="true"
      />
    } @else if (queryInput()) {
      <button type="button" class="symbol-search-clear" (click)="clearQuery()"
              title="Clear search" aria-label="Clear search">
        <app-icon name="close" />
      </button>
    }
  </div>
</div>
