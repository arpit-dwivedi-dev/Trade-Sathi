<div class="nav-head">
  <a class="brand" routerLink="/app">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17.5 8.5 11l3.5 3.5L21 6" />
        <path d="M16 6h5v5" />
      </svg>
    </span>
    <b>Trade</b><span>Sathi</span>
  </a>

  <!-- Lives on the rail rather than on any one screen: the rail is what it
       acts on, and it is the only thing still on screen once the rail is
       collapsed to icons. -->
  <button pButton [rounded]="true" [text]="true" class="nav-collapse" (click)="toggleCollapsed()"
          [attr.aria-pressed]="collapsed()"
          [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
          [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
    <app-icon aria-hidden="true"
              [name]="collapsed() ? 'left_panel_open' : 'left_panel_close'" />
  </button>
</div>

<div class="nav-body">
  <span class="nav-lbl">Analyze</span>

  <button type="button" class="nav-item nav-item-disabled" title="Dashboard — coming soon" disabled
          aria-disabled="true">
    <app-icon aria-hidden="true" name="dashboard" />
    <span class="nav-item-lbl">Dashboard</span>
    <span class="nav-soon">Coming soon</span>
  </button>

  <button type="button" class="nav-item" title="Analyze by Image" (click)="select('analyze')"
          [attr.aria-current]="active() === 'analyze' ? 'page' : null">
    <app-icon aria-hidden="true" name="image_search" />
    <span class="nav-item-lbl">Analyze by Image</span>
  </button>

  <button type="button" class="nav-item" title="Analyze by Symbol" (click)="select('workspace')"
          [attr.aria-current]="active() === 'workspace' ? 'page' : null">
    <app-icon aria-hidden="true" name="candlestick_chart" />
    <span class="nav-item-lbl">Analyze by Symbol</span>
  </button>

  <button type="button" class="nav-item" title="Daily Briefing" (click)="select('dailyBriefing')"
          [attr.aria-current]="active() === 'dailyBriefing' ? 'page' : null">
    <app-icon aria-hidden="true" name="routine" />
    <span class="nav-item-lbl">Daily Briefing</span>
  </button>

  <button type="button" class="nav-item" title="History" (click)="select('history')"
          [attr.aria-current]="active() === 'history' ? 'page' : null">
    <app-icon aria-hidden="true" name="history" />
    <span class="nav-item-lbl">History</span>
  </button>

  <span class="nav-lbl">Research</span>

  <button type="button" class="nav-item" title="Fundamentals" (click)="select('fundamentals')"
          [attr.aria-current]="active() === 'fundamentals' ? 'page' : null">
    <app-icon aria-hidden="true" name="balance" />
    <span class="nav-item-lbl">Fundamentals</span>
  </button>

  <button type="button" class="nav-item nav-item-disabled" title="News & Events — coming soon" disabled
          aria-disabled="true">
    <app-icon aria-hidden="true" name="newspaper" />
    <span class="nav-item-lbl">News & Events</span>
    <span class="nav-soon">Coming soon</span>
  </button>

  <span class="nav-lbl">Account</span>

  <button type="button" class="nav-item" title="Activity Logs" (click)="select('logs')"
          [attr.aria-current]="active() === 'logs' ? 'page' : null">
    <app-icon aria-hidden="true" name="list_alt" />
    <span class="nav-item-lbl">Activity Logs</span>
  </button>

  <button type="button" class="nav-item" title="Billing" (click)="select('billing')"
          [attr.aria-current]="active() === 'billing' ? 'page' : null">
    <app-icon aria-hidden="true" name="credit_card" />
    <span class="nav-item-lbl">Billing</span>
  </button>

  <button type="button" class="nav-item" title="Account Settings" (click)="select('account')"
          [attr.aria-current]="active() === 'account' ? 'page' : null">
    <app-icon aria-hidden="true" name="person" />
    <span class="nav-item-lbl">Account Settings</span>
  </button>
</div>

<div class="nav-foot">
  <!-- No balance on the label: the figure is the Billing screen's subject, not
       this button's. Printed here it read as part of the action ("buy 35"), and
       it changed under the user's eyes after every analysis. -->
  <button pButton size="small" class="nav-cta" (click)="select('billing')">
    Buy Credits
  </button>

  <!-- Identity, not a control: the initial gives the rail an anchor when the
       name is too long to show in full. -->
  <span class="who" [title]="user()?.email">
    <span class="who-mark" aria-hidden="true">{{ name().charAt(0) }}</span>
    <span class="who-email trunc">{{ name() }}</span>
  </span>
</div>
