<div class="nav-head">
  <a class="brand" routerLink="/app">
    <span class="brand-mark" aria-hidden="true"></span>
    <b>Trade</b><span>Sathi</span>
  </a>

  <!-- Lives on the rail rather than on any one screen: the rail is what it
       acts on, and it is the only thing still on screen once the rail is
       collapsed to icons. -->
  <button pButton [rounded]="true" [text]="true" class="nav-collapse" (click)="toggleCollapsed()"
          [attr.aria-pressed]="collapsed()"
          [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
          [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
    <app-icon aria-hidden="true"
              [name]="collapsed() ? 'left_panel_open' : 'left_panel_close'" />
  </button>
</div>

<!-- Every row reads its wording from `labels` rather than spelling it out, and
     the string it reads is the id it navigates to, kebab-cased. One name per
     destination, so the row, the URL and the top bar's title cannot drift.
     Collapsed to icons the label is hidden, which is what the tooltip is for. -->
<div class="nav-body">
  <span class="nav-lbl">Analyze</span>

  <button type="button" class="nav-item nav-item-disabled" title="Dashboard — coming soon" disabled
          aria-disabled="true">
    <app-icon aria-hidden="true" name="dashboard" />
    <span class="nav-item-lbl">Dashboard</span>
    <span class="nav-soon">Coming soon</span>
  </button>

  <button type="button" class="nav-item" [title]="labels['analyze-by-image']"
          (click)="select('analyze-by-image')"
          [attr.aria-current]="active() === 'analyze-by-image' ? 'page' : null">
    <app-icon aria-hidden="true" name="image_search" />
    <span class="nav-item-lbl"><span class="title-wide">{{ labels['analyze-by-image'] }}</span><span class="title-phone">Image Analysis</span></span>
  </button>

  <button type="button" class="nav-item" [title]="labels['symbol-search']"
          (click)="select('symbol-search')"
          [attr.aria-current]="active() === 'symbol-search' ? 'page' : null">
    <app-icon aria-hidden="true" name="candlestick_chart" />
    <span class="nav-item-lbl">{{ labels['symbol-search'] }}</span>
  </button>

  <button type="button" class="nav-item" [title]="labels['daily-briefing']"
          (click)="select('daily-briefing')"
          [attr.aria-current]="active() === 'daily-briefing' ? 'page' : null">
    <app-icon aria-hidden="true" name="routine" />
    <span class="nav-item-lbl">{{ labels['daily-briefing'] }}</span>
  </button>

  <button type="button" class="nav-item" [title]="labels['history']"
          (click)="select('history')"
          [attr.aria-current]="active() === 'history' ? 'page' : null">
    <app-icon aria-hidden="true" name="history" />
    <span class="nav-item-lbl">{{ labels['history'] }}</span>
  </button>

  <span class="nav-lbl">Research</span>

  <button type="button" class="nav-item" [title]="labels['fundamentals']"
          (click)="select('fundamentals')"
          [attr.aria-current]="active() === 'fundamentals' ? 'page' : null">
    <app-icon aria-hidden="true" name="balance" />
    <span class="nav-item-lbl">{{ labels['fundamentals'] }}</span>
  </button>

  <button type="button" class="nav-item nav-item-disabled" title="News & Events — coming soon" disabled
          aria-disabled="true">
    <app-icon aria-hidden="true" name="newspaper" />
    <span class="nav-item-lbl">News & Events</span>
    <span class="nav-soon">Coming soon</span>
  </button>

  <span class="nav-lbl">Account</span>

  <button type="button" class="nav-item" [title]="labels['activity-logs']"
          (click)="select('activity-logs')"
          [attr.aria-current]="active() === 'activity-logs' ? 'page' : null">
    <app-icon aria-hidden="true" name="list_alt" />
    <span class="nav-item-lbl">{{ labels['activity-logs'] }}</span>
  </button>

  <button type="button" class="nav-item" [title]="labels['billing']"
          (click)="select('billing')"
          [attr.aria-current]="active() === 'billing' ? 'page' : null">
    <app-icon aria-hidden="true" name="credit_card" />
    <span class="nav-item-lbl">{{ labels['billing'] }}</span>
  </button>

  <button type="button" class="nav-item" [title]="labels['account-settings']"
          (click)="select('account-settings')"
          [attr.aria-current]="active() === 'account-settings' ? 'page' : null">
    <app-icon aria-hidden="true" name="person" />
    <span class="nav-item-lbl">{{ labels['account-settings'] }}</span>
  </button>

  @if (isAdmin()) {
    <span class="nav-lbl">Admin</span>

    <button type="button" class="nav-item" [title]="labels['admin']"
            (click)="select('admin')"
            [attr.aria-current]="active() === 'admin' ? 'page' : null">
      <app-icon aria-hidden="true" name="monitoring" />
      <span class="nav-item-lbl">{{ labels['admin'] }}</span>
    </button>
  }
</div>

<div class="nav-foot">
  <!-- No balance on the label: the figure is the Billing screen's subject, not
       this button's. Printed here it read as part of the action ("buy 35"), and
       it changed under the user's eyes after every analysis. -->
  <button pButton size="small" class="nav-cta" (click)="select('billing')">
    Buy Credits
  </button>

  <!-- Identity, not a control: the initial gives the rail an anchor when the
       name is too long to show in full. -->
  <span class="who" [title]="user()?.email">
    <span class="who-mark" aria-hidden="true">{{ name().charAt(0) }}</span>
    <span class="who-email trunc">{{ name() }}</span>
  </span>

  <!-- Phones only: the header is too narrow to hold these, so they move here,
       at the bottom of the drawer and away from the thumb's resting spot. -->
  <div class="nav-mobile-actions">
    <button type="button" class="nav-item" (click)="toggleTheme()">
      <app-icon aria-hidden="true" [name]="theme() === 'dark' ? 'light_mode' : 'dark_mode'" />
      <span class="nav-item-lbl">{{ theme() === 'dark' ? 'Light theme' : 'Dark theme' }}</span>
    </button>
    <button type="button" class="nav-item nav-item-danger" (click)="signOut()">
      <app-icon aria-hidden="true" name="logout" />
      <span class="nav-item-lbl">Sign out</span>
    </button>
  </div>
</div>
