<main class="landing">
  <header class="bar landing-bar">
    <div class="landing-inner landing-bar-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <b>Trade</b><span>Sathi</span>
      </span>
      <nav class="landing-nav">
        <button pButton [rounded]="true" [text]="true" (click)="toggleTheme()"
                [attr.title]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
                [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
          <app-icon aria-hidden="true" [name]="theme() === 'dark' ? 'light_mode' : 'dark_mode'" />
        </button>
        <a class="landing-link" routerLink="/login">Sign in</a>
        <a pButton size="small" routerLink="/signup">Create account</a>
      </nav>
    </div>
  </header>
</main>
