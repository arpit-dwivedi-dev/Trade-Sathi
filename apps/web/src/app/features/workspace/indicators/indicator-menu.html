<div class="ind-menu">
  <button
    type="button"
    class="ind-trigger"
    [class.ind-trigger-on]="active().size > 0"
    [class.ind-trigger-open]="open()"
    (click)="togglePanel($event)"
    aria-haspopup="true"
    title="Add indicators to the chart"
  >
    <app-icon class="ind-trigger-icon" aria-hidden="true" name="stacked_line_chart" />
    <span class="ind-trigger-label">Indicators</span>
    @if (active().size > 0) {
      <span class="ind-trigger-count" [attr.aria-label]="active().size + ' active'">{{ active().size }}</span>
    }
    <app-icon class="ind-trigger-caret" aria-hidden="true" name="expand_more" />
  </button>

  <p-popover
    #panel
    styleClass="ind-panel"
    [appendTo]="appendTo()"
    (onShow)="open.set(true)"
    (onHide)="open.set(false)"
  >
    <ng-template #content>
      <div class="ind-top">
        <span class="ind-top-text">
          <span class="ind-top-title">Indicators</span>
          <span class="ind-top-sub">
            @if (active().size === 0) {
              Nothing on the chart yet
            } @else {
              {{ active().size }} of {{ total }} active
            }
          </span>
        </span>
        @if (active().size > 0) {
          <button type="button" class="ind-clear" (click)="clear()">
            <app-icon aria-hidden="true" name="backspace" />
            Clear all
          </button>
        }
      </div>

      <div class="ind-scroll">
        <div class="ind-head">
          <app-icon aria-hidden="true" name="candlestick_chart" />
          <span class="ind-head-title">On the price pane</span>
        </div>
        @for (option of overlays; track option.kind) {
          <button
            type="button"
            class="ind-item"
            [class.ind-item-on]="isActive(option.kind)"
            (click)="toggle(option.kind)"
            [attr.aria-pressed]="isActive(option.kind)"
          >
            <span class="ind-glyph" aria-hidden="true"><app-icon [name]="option.icon" /></span>
            <span class="ind-text">
              <span class="ind-label">{{ option.label }}</span>
              <span class="ind-code">{{ option.kind }}</span>
            </span>
            <span class="ind-switch" aria-hidden="true"></span>
          </button>
        }

        <div class="ind-head">
          <app-icon aria-hidden="true" name="view_agenda" />
          <span class="ind-head-title">In their own panel</span>
        </div>
        @for (option of panels; track option.kind) {
          <button
            type="button"
            class="ind-item"
            [class.ind-item-on]="isActive(option.kind)"
            (click)="toggle(option.kind)"
            [attr.aria-pressed]="isActive(option.kind)"
          >
            <span class="ind-glyph" aria-hidden="true"><app-icon [name]="option.icon" /></span>
            <span class="ind-text">
              <span class="ind-label">{{ option.label }}</span>
              <span class="ind-code">{{ option.kind }}</span>
            </span>
            <span class="ind-switch" aria-hidden="true"></span>
          </button>
        }
      </div>
    </ng-template>
  </p-popover>
</div>
