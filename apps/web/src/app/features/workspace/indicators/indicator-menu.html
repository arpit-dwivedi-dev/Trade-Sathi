<div class="ind-menu">
  <button
    type="button"
    class="btn btn-g btn-sm"
    (click)="toggleMenu()"
    [attr.aria-expanded]="open()"
    aria-haspopup="true"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 17.5 8.5 11l3.5 3.5L21 6" />
      <path d="M16 6h5v5" />
    </svg>
    Indicators
    @if (active().size > 0) {
      <span class="chip ind-count">{{ active().size }}</span>
    }
  </button>

  @if (open()) {
    <!-- Closes the menu by tapping away from it. -->
    <div class="ind-scrim" (click)="closeMenu()" aria-hidden="true"></div>

    <ul class="menu ind-list">
      @for (option of options; track option.kind) {
        <li>
          <button type="button" (click)="toggle(option.kind)" [attr.aria-pressed]="isActive(option.kind)">
            <span class="ind-check" [class.ind-check-on]="isActive(option.kind)" aria-hidden="true"></span>
            <span class="ind-label">{{ option.label }}</span>
            <span class="ind-pane">{{ option.pane === 'sub' ? 'panel' : 'overlay' }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
