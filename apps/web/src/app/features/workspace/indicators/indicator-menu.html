<div class="ind-menu">
  <button
    type="button"
    mat-stroked-button
    [matMenuTriggerFor]="indicatorMenu"
    [matBadge]="active().size"
    [matBadgeHidden]="active().size === 0"
    matBadgeSize="small"
    matBadgeOverlap="false"
    aria-haspopup="true"
  >
    <mat-icon aria-hidden="true">stacked_line_chart</mat-icon>
    Indicators
  </button>

  <mat-menu #indicatorMenu="matMenu" xPosition="before">
    @for (option of options; track option.kind) {
      <button mat-menu-item (click)="toggle($event, option.kind)" [attr.aria-pressed]="isActive(option.kind)">
        <mat-icon aria-hidden="true">{{ isActive(option.kind) ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
        <span class="ind-label">{{ option.label }}</span>
        <span class="ind-pane">{{ option.pane === 'sub' ? 'panel' : 'overlay' }}</span>
      </button>
    }
  </mat-menu>
</div>
