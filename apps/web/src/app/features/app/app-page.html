<main class="shell">
  @if (user(); as currentUser) {
    <header class="bar">
      <div class="content-max bar-inner">
        <span class="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--acc)"
               stroke-width="1.5" aria-hidden="true">
            <path d="M12 2v20M2 12h20" />
            <circle cx="12" cy="12" r="6.5" />
          </svg>
          <b>Chart</b><span>Analyzer</span>
        </span>

        <div class="bar-end">
          <span class="bar-email trunc">{{ currentUser.email }}</span>
          <button type="button" class="btn btn-p btn-sm" (click)="openPlans()">
            {{ billingLabel() }}
          </button>
          <button type="button" class="btn btn-g btn-sm btn-icon" (click)="toggleTheme()"
                  [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
            @if (theme() === 'dark') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            }
          </button>
          <button type="button" class="btn btn-s btn-sm" (click)="signOut()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="15" height="15">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            Sign out
          </button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <div class="content-max tabs-inner">
        <button type="button" class="tab" (click)="select('analyze')"
                [attr.aria-current]="tab() === 'analyze' ? 'page' : null">Analyze</button>
        <button type="button" class="tab" (click)="select('history')"
                [attr.aria-current]="tab() === 'history' ? 'page' : null">History</button>
        <a class="tab" routerLink="/account">Account</a>
      </div>
    </nav>

    <!-- Analyze stays mounted while hidden: an in-flight upload/poll must not
         be torn down just because the user glanced at their history. History,
         by contrast, is created on each activation, which is exactly the
         refetch that picks up analyses finished on the other tab. -->
    <div [hidden]="tab() !== 'analyze'">
      <app-analyze-page (plansRequested)="openPlans()" />
    </div>

    @if (tab() === 'history') {
      <app-history-list />
    }

    <!-- Mounted only while open, so closing tears the purchase buttons down
         through their own ngOnDestroy and a reopen starts from a clean state. -->
    @if (plansOpen()) {
      <app-plans-overlay
        (closed)="closePlans()"
        (upgraded)="onUpgraded()"
        (creditsAdded)="onCreditsAdded()"
      />
    }
  } @else {
    <!-- Rendered during SSR and before client-side session restoration completes. -->
    <div class="shell-loading">
      <span class="spin" aria-hidden="true"></span>
      <p class="lbl">Loading…</p>
    </div>
  }
</main>
