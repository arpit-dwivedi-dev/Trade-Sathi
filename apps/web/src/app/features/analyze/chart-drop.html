<div
  class="plate drop-zone"
  [class.over]="dragging()"
  [class.disabled]="disabled()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  (click)="browse()"
>
  <span class="lbl drop-corner-l">Chart screenshot</span>
  <span class="lbl drop-corner-r">PNG · JPG · WEBP</span>

  <div class="drop-keys" aria-hidden="true">
    <span class="kbd">Ctrl</span>
    <span class="drop-plus">+</span>
    <span class="kbd">V</span>
  </div>

  <div class="drop-copy">
    <h2>{{ dragging() ? 'Drop to upload' : 'Paste a chart screenshot' }}</h2>
    <p class="drop-sub">Or drop an image here.</p>
  </div>

  <span class="btn btn-s drop-browse">Upload a screenshot</span>

  <p class="disc drop-hint">
    Include the price axis and the timeframe label — the symbol, timeframe and levels are read
    from the image.
  </p>
</div>

<!-- Outside the drop-zone on purpose: browse() calls input.click(), and a click
     event on a child would bubble back to the zone's own (click) handler. -->
<input
  #fileInput
  type="file"
  hidden
  [accept]="acceptedTypes"
  [disabled]="disabled()"
  (change)="onPick($event)"
/>
