<div
  class="plate drop-zone"
  [class.over]="dragging()"
  [class.disabled]="disabled()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  (click)="browse()"
>
  <span class="lbl drop-formats">PNG · JPG · WEBP</span>

  <span class="drop-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path d="M3 15.5 8 11l3.5 3.5L15 11l6 5.5" />
      <circle cx="8.5" cy="8.5" r="1.2" />
    </svg>
  </span>

  <div class="drop-copy">
    <h2 class="drop-title">
      {{ dragging() ? 'Drop to upload' : 'Paste a chart screenshot' }}
    </h2>
    <p class="drop-sub">
      Press <span class="kbd">Ctrl</span><span class="kbd">V</span> or drop an image here
    </p>
  </div>

  <span class="btn btn-s drop-browse">Choose a file</span>

  <p class="disc drop-hint">
    Include the price axis and the timeframe label — the symbol, timeframe and levels are read
    from the image.
  </p>
</div>

<!-- Outside the drop-zone on purpose: browse() calls input.click(), and a click
     event on a child would bubble back to the zone's own (click) handler. -->
<input
  #fileInput
  type="file"
  hidden
  [accept]="acceptedTypes"
  [disabled]="disabled()"
  (change)="onPick($event)"
/>
