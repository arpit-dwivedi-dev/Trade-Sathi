<main style="max-width: 24rem; margin: 4rem auto; padding: 0 1rem; font-family: sans-serif">
  <h1>Reset your password</h1>

  @if (sent()) {
    <p style="color: #15803d">
      If an account exists for that email, a reset link is on its way. The link
      expires shortly, so use it soon.
    </p>
  } @else {
    <p>Enter your email and we'll send you a link to set a new password.</p>

    <form (ngSubmit)="submit()" style="display: flex; flex-direction: column; gap: 0.75rem">
      <label>
        Email
        <input type="email" name="email" required autocomplete="email"
               [ngModel]="email()" (ngModelChange)="email.set($event)"
               style="display: block; width: 100%; padding: 0.5rem" />
      </label>

      <button type="submit" [disabled]="busy()" style="padding: 0.5rem">
        {{ busy() ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>

    @if (error(); as message) {
      <p style="color: #b91c1c">{{ message }}</p>
    }
  }

  <p style="margin-top: 1rem"><a routerLink="/login">Back to sign in</a></p>
</main>
