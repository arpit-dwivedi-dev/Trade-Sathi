<main style="max-width: 24rem; margin: 4rem auto; padding: 0 1rem; font-family: sans-serif">
  <h1>Choose a new password</h1>

  @switch (ready()) {
    @case (null) {
      <p>Checking your reset link…</p>
    }
    @case (true) {
      <form (ngSubmit)="submit()" style="display: flex; flex-direction: column; gap: 0.75rem">
        <label>
          New password
          <input type="password" name="password" required autocomplete="new-password"
                 [ngModel]="password()" (ngModelChange)="password.set($event)"
                 style="display: block; width: 100%; padding: 0.5rem" />
        </label>

        <label>
          Confirm new password
          <input type="password" name="confirm" required autocomplete="new-password"
                 [ngModel]="confirm()" (ngModelChange)="confirm.set($event)"
                 style="display: block; width: 100%; padding: 0.5rem" />
        </label>

        <button type="submit" [disabled]="busy()" style="padding: 0.5rem">
          {{ busy() ? 'Saving…' : 'Save new password' }}
        </button>
      </form>
    }
    @case (false) {
      <p>This reset link is no longer valid. Request a new one to try again.</p>
      <p><a routerLink="/forgot-password">Send a new reset link</a></p>
    }
  }

  @if (error(); as message) {
    <p style="color: #b91c1c">{{ message }}</p>
  }

  <p style="margin-top: 1rem"><a routerLink="/login">Back to sign in</a></p>
</main>
