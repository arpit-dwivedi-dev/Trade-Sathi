<!-- A plain fixed layer, not <dialog>.showModal(): the top layer would paint
     above Razorpay Checkout and make paying impossible. -->
<div class="plans-scrim" (click)="onBackdropClick($event)">
  <!-- tabindex="-1" so the panel can take focus on open without becoming a
       tab stop of its own afterwards. -->
  <div #panel class="plans-panel" role="dialog" aria-modal="true" tabindex="-1"
       aria-labelledby="plans-title">
    <header class="plans-bar">
      <div class="plans-title-block">
        <h2 id="plans-title" class="plans-title">Plans &amp; credits</h2>
        @if (loading()) {
          <span class="plans-sub"><span class="spin" aria-hidden="true"></span> Loading your plan…</span>
        } @else {
          <span class="plans-sub">
            You're on <b>{{ planLabel() }}</b>
          </span>
        }
      </div>

      <!-- Disabled, not hidden, while a payment is being confirmed: the control
           staying visibly present and inert explains itself better than a
           button that vanishes mid-flow. -->
      <button type="button" class="btn btn-g btn-sm btn-icon" (click)="close()"
              [disabled]="purchaseInFlight()"
              [attr.title]="purchaseInFlight() ? 'Hold on — confirming your payment' : 'Close'"
              aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    @if (!loading()) {
      <div class="plans-body">
        <!-- Only free-plan users are offered an upgrade; paid users get credits
             only, since changing between paid tiers is not built. -->
        @if (canUpgrade()) {
          <section class="plans-section">
            <div class="plans-section-head">
              <h3 class="plans-section-title">Monthly plans</h3>
              <p class="plans-note">A higher allowance every month, billed by Razorpay.</p>
            </div>
            <app-upgrade-button (upgraded)="onUpgraded()" />
          </section>
        }

        <section class="plans-section">
          <div class="plans-section-head">
            <h3 class="plans-section-title">One-off top up</h3>
            <p class="plans-note">Credits never expire and stack on top of your monthly allowance.</p>
          </div>
          <app-buy-credits-button (creditsAdded)="onCreditsAdded()" />
        </section>
      </div>
    }
  </div>
</div>
