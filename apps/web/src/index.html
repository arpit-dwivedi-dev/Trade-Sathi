<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TradeSathi</title>
  <meta name="description" content="Paste a chart screenshot and get trend, volatility, volume and sentiment readings, support and resistance levels, and a written summary.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- favicons -->
  <link rel="icon" href="/brand/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/brand/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/apple-touch-icon.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Trade Sathi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trade Sathi">
  <meta property="og:title" content="Trade Sathi">
  <meta property="og:description" content="Your AI Trading Companion">
  <meta property="og:image" content="https://tradesathi.app/brand/social/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Trade Sathi — Your AI Trading Companion">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Trade Sathi">
  <meta name="twitter:description" content="Your AI Trading Companion">
  <meta name="twitter:image" content="https://tradesathi.app/brand/social/twitter-card.png">
  <!-- Resolve the theme before first paint (same rule as ThemeService): a
       stored choice wins, otherwise follow the OS. Without this, dark-mode
       users get a flash of the server-rendered light page. -->
  <script>
    try {
      var t = localStorage.getItem('tradesathi.theme');
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
